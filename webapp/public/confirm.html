<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HearMe — Confirmation du compte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #0a0a12; color: #e5e7eb;
      font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
      background-image: radial-gradient(60% 50% at 50% 0%, rgba(124,92,255,.18), transparent 70%);
    }
    .card {
      width: 100%; max-width: 440px; text-align: center; padding: 36px 28px;
      background: rgba(23,18,39,.7); border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px; backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .badge {
      width: 68px; height: 68px; margin: 0 auto 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 34px;
      background: rgba(16,185,129,.15); color: #34d399;
    }
    .badge.err { background: rgba(244,63,94,.15); color: #fb7185; }
    h1 { font-size: 22px; margin: 0 0 8px; color: #fff; }
    p { font-size: 14px; line-height: 1.6; color: #9ca3af; margin: 0 0 22px; }
    .btn {
      display: inline-block; text-decoration: none; font-weight: 600; font-size: 15px;
      padding: 13px 26px; border-radius: 12px; color: #fff;
      background: linear-gradient(90deg, #7c5cff, #c24df0);
    }
    .brand { font-weight: 700; font-size: 20px; color: #a78bfa; margin-bottom: 18px; letter-spacing: .5px; }
    .hint { font-size: 12px; color: #6b7280; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">HearMe</div>
    <div id="badge" class="badge">✓</div>
    <h1 id="title">Adresse confirmée 🎉</h1>
    <p id="msg">Votre compte HearMe est activé. Ouvrez l'app <strong>HearMe</strong> et connectez-vous : votre téléphone se liera automatiquement.</p>
    <a id="cta" class="btn" href="./">Ouvrir le panneau</a>
    <div class="hint">Sur téléphone, revenez simplement dans l'application.</div>
  </div>

  <script>
    // Le lien a déjà été vérifié côté serveur par Supabase. On ne gère ici que
    // l'affichage : succès par défaut, ou message si le lien est expiré/invalide.
    (function () {
      var params = new URLSearchParams(
        (location.hash || '').replace(/^#/, '') || (location.search || '').replace(/^\?/, '')
      );
      var err = params.get('error_description') || params.get('error');
      if (err) {
        document.getElementById('badge').className = 'badge err';
        document.getElementById('badge').textContent = '!';
        document.getElementById('title').textContent = 'Lien invalide ou expiré';
        document.getElementById('msg').textContent = decodeURIComponent(err).replace(/\+/g, ' ');
        document.getElementById('cta').textContent = 'Retour à la connexion';
      }
    })();
  </script>
</body>
</html>
