<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HearMe — Confirmation du compte</title>
  <meta name="description" content="Confirmation de votre compte HearMe." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { brand: { violet: "#7c5cff", magenta: "#c24df0" } },
        fontFamily: { sans: ["Poppins", "ui-sans-serif", "system-ui", "sans-serif"] },
      } },
    };
  </script>
  <link rel="stylesheet" href="assets/css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="hm-mesh min-h-screen text-slate-100 flex items-center justify-center p-4">
  <main class="w-full max-w-md">
    <div class="hm-glass rounded-3xl p-7 sm:p-8 shadow-2xl text-center">
      <!-- Logo -->
      <svg viewBox="0 0 48 48" class="w-14 h-14 mx-auto" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7c5cff" /><stop offset="1" stop-color="#c24df0" />
          </linearGradient>
        </defs>
        <path d="M24 3l16 6v10.5C40 30 33 37.6 24 42 15 37.6 8 30 8 19.5V9l16-6z" fill="url(#g)" />
        <g fill="#fff">
          <rect x="14.5" y="20" width="3" height="8"  rx="1.5" />
          <rect x="18.5" y="17" width="3" height="14" rx="1.5" />
          <rect x="22.5" y="14" width="3" height="20" rx="1.5" />
          <rect x="26.5" y="17" width="3" height="14" rx="1.5" />
          <rect x="30.5" y="20" width="3" height="8"  rx="1.5" />
        </g>
      </svg>

      <!-- État (pastille) -->
      <div id="badge" class="mx-auto mt-6 flex h-16 w-16 items-center justify-center rounded-full bg-white/5">
        <div id="spinner" class="h-7 w-7 rounded-full border-2 border-white/20 border-t-brand-violet animate-spin"></div>
        <svg id="icon-ok" class="hidden h-9 w-9 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <svg id="icon-err" class="hidden h-9 w-9 text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
      </div>

      <h1 id="title" class="mt-5 text-xl font-bold">Vérification en cours…</h1>
      <p id="msg" class="mt-2 text-sm text-slate-400">Un instant pendant qu'on confirme votre adresse.</p>

      <div id="actions" class="mt-6 space-y-3"></div>
    </div>

    <p class="mt-5 text-center text-xs text-slate-500">
      <a href="privacy.html" class="hover:text-slate-300 hover:underline">Politique de confidentialité</a>
    </p>
  </main>

  <!-- Scripts (ordre important) -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/session.js"></script>
  <script>
    (async function () {
      const $ = (id) => document.getElementById(id);
      const initialHash = location.hash || "";

      // Laisse le client Supabase (detectSessionInUrl) traiter le jeton du lien.
      let session = null;
      for (let i = 0; i < 12 && !session; i++) {
        try { const { data } = await HM.sb.auth.getSession(); session = data.session; } catch (_) {}
        if (session) break;
        await new Promise((r) => setTimeout(r, 150));
      }

      // Erreur éventuelle transmise par Supabase (lien expiré, déjà utilisé…).
      const p = new URLSearchParams((initialHash.slice(1)) || location.search.slice(1));
      const err = p.get("error_description") || p.get("error");

      $("spinner").classList.add("hidden");

      if (session || (!err)) {
        // Succès (session établie, ou lien ouvert sans erreur = déjà confirmé).
        if (session) HM.session.setAuth();
        $("icon-ok").classList.remove("hidden");
        $("title").textContent = "Adresse confirmée 🎉";
        $("msg").innerHTML =
          "Votre compte HearMe est activé.<br>Ouvrez l'app <strong>HearMe</strong> sur votre téléphone et " +
          "<strong>connectez-vous</strong> : votre appareil se liera automatiquement.";
        const dash = session ? "dashboard.html" : "index.html";
        $("actions").innerHTML =
          '<a href="' + dash + '" class="block w-full rounded-xl hm-gradient-bg px-4 py-3 text-sm font-semibold text-white hover:opacity-90">Ouvrir le panneau web</a>' +
          '<p class="text-xs text-slate-500">Sur téléphone, revenez simplement dans l\'application.</p>';
      } else {
        // Échec : lien invalide ou expiré.
        $("icon-err").classList.remove("hidden");
        $("title").textContent = "Lien invalide ou expiré";
        $("msg").textContent = decodeURIComponent(err).replace(/\+/g, " ");
        $("actions").innerHTML =
          '<a href="index.html" class="block w-full rounded-xl hm-gradient-bg px-4 py-3 text-sm font-semibold text-white hover:opacity-90">Retour à la connexion</a>' +
          '<p class="text-xs text-slate-500">Recréez un compte dans l\'app pour recevoir un nouveau lien.</p>';
      }
    })();
  </script>
</body>
</html>
