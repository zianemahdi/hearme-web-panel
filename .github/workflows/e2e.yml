name: E2E — tests du panneau (Playwright)

# Lance les tests end-to-end contre le panneau DÉPLOYÉ (aucun Node requis en local).
on:
  workflow_dispatch:          # bouton « Run workflow » dans l'onglet Actions
  push:
    paths:
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '0 6 * * 1'       # tous les lundis à 06:00 UTC (surveillance de régression)

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx playwright test
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
